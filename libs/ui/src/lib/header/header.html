<header class="bg-secondary text-white shadow-md sticky top-0 z-50">
  <div class="container mx-auto flex items-center justify-between w-full px-6 py-4">

    <div class="flex items-center gap-3">
      <a routerLink="/news" (click)="closeMenu()">
        <img src="/logo.png" alt="Fortnite Radar" width="84px" />
      </a>
    </div>

    <nav class="hidden md:flex items-center space-x-6 lg:space-x-12 text-md lg:text-xl text-accent font-bold">
      <a routerLink="/news" class="cursor-pointer">News</a>
      <a routerLink="/events" class="cursor-pointer">Events</a>
      <a routerLink="/maps" class="cursor-pointer">Map</a>
      <a routerLink="/shop" class="cursor-pointer">Shop</a>
    </nav>

    <button type="button" class="md:hidden text-accent" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()"
      aria-label="Toggle navigation menu" aria-controls="mobile-nav">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        @if (menuOpen()) {
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        } @else {
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        }
      </svg>
    </button>
  </div>

  @if (menuOpen()) {
  <nav id="mobile-nav" class="md:hidden flex flex-col items-center gap-4 pb-6 text-lg text-accent font-bold">
    <a routerLink="/news" (click)="closeMenu()" class="cursor-pointer">News</a>
    <a routerLink="/events" (click)="closeMenu()" class="cursor-pointer">Events</a>
    <a routerLink="/maps" (click)="closeMenu()" class="cursor-pointer">Map</a>
    <a routerLink="/shop" (click)="closeMenu()" class="cursor-pointer">Shop</a>
  </nav>
  }
</header>
